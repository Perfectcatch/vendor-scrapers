name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ced, pool360, homedepot]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: vendor-scrapers/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test env files
        run: |
          cp services/ced/.env.template services/ced/.env
          cp services/pool360/.env.template services/pool360/.env
          cp services/homedepot/.env.template services/homedepot/.env

      - name: Start services
        run: |
          cd compose
          docker compose -f vendor-scrapers.yml up -d --build
        
      - name: Wait for services
        run: sleep 45

      - name: Health check - CED
        run: curl -f http://localhost:3011/health

      - name: Health check - Pool360
        run: curl -f http://localhost:3021/health

      - name: Health check - Home Depot
        run: curl -f http://localhost:3022/health

      - name: Cleanup
        if: always()
        run: |
          cd compose
          docker compose -f vendor-scrapers.yml down

  release:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release Tag
        run: |
          VERSION=$(date +%Y.%m.%d)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Tag Release
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "v${{ env.VERSION }}" -m "Release ${{ env.VERSION }}" || true
          git push origin "v${{ env.VERSION }}" || true
